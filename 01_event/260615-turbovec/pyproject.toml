# The 260615 scripts are standalone and import nothing from the shared package;
# this file only declares what they need.

[project]
name = "turbovec-demo"
version = "0.1.0"
description = "The 260615 meeting: turbovec vector compression against a float32 baseline."
requires-python = ">=3.11,<4.0"
dependencies = [
    "datasets>=5.0.0",
    "defusedxml>=0.7.1",
    "huggingface-hub>=1.19.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "tqdm>=4.68.2",
    "turbovec>=0.8.0",
]

[tool.uv]
package = false
