[project]
name = "rag-bias"
version = "0.1.0"
description = "The 260901 retrieval bias study (A = p_k/p0) on the shared RAG pipeline."
requires-python = ">=3.11,<4.0"
dependencies = [
    "workshop-rag-forum[turbovec]",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "typing-extensions>=4.15.0",
]

[project.scripts]
rag-bias = "rag_bias.cli:main"

[tool.uv.sources]
workshop-rag-forum = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bias"]
