[project]
name = "rag-bias"
version = "0.1.0"
description = "The 260901 retrieval bias study (A = p_k/p0) on a small RAG pipeline."
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "turbovec>=0.8.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
rag-bias = "rag_bias.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# workshop_rag_forum is the pipeline, rag_bias the study on top of it.
packages = ["src/workshop_rag_forum", "src/rag_bias"]
